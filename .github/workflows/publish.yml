name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'prerelease = -dev.N build (:dev); patch/minor/major = release (:latest)'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major

# The version is derived from the existing tags, so two runs close together
# would compute the same one. Queue instead of cancelling.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/calaos/calaos_home

jobs:
  verify-ci:
    name: Verify commit is on master with green CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check ref and CI result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::publish only runs from master (got $GITHUB_REF)"
            exit 1
          fi
          runs=$(gh run list --workflow pr-ci.yml --commit "$GITHUB_SHA" --json conclusion,status)
          if [ "$(jq length <<<"$runs")" -eq 0 ]; then
            echo "::error::no CI run for this commit (docs-only?) — publish from a code commit"
            exit 1
          fi
          if ! jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
            echo "::error::PR CI is not green on $GITHUB_SHA: $runs"
            exit 1
          fi

  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    needs: verify-ci
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event.inputs.channel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calaos Action Bump Version
        id: calaos_version
        uses: calaos/action-bump-version@2
        with:
          version_fragment: ${{ env.CHANNEL }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:docker"
          push: true
          build-args: APP_VERSION=${{ steps.calaos_version.outputs.version_bumped }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.CHANNEL == 'prerelease' && 'dev' || 'latest' }}
            ${{ env.REGISTRY_IMAGE }}:${{ steps.calaos_version.outputs.version_bumped }}

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.calaos_version.outputs.version_bumped }}
          token: ${{ secrets.ACTION_DISPATCH }}

      - name: Build deb
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACTION_DISPATCH }}
          repository: calaos/pkgdebs
          event-type: build_deb
          client-payload: '{ "pkgname": "calaos-home", "version": "${{ steps.calaos_version.outputs.version_bumped }}", "image_src": "${{ env.REGISTRY_IMAGE }}:${{ steps.calaos_version.outputs.version_bumped }}", "prerelease": ${{ env.CHANNEL == ''prerelease'' }} }'
