name: PR CI

# CI de pull request (T03) : compile réellement le code, exécute les tests
# unitaires et passe qmllint. Les workflows existants (build*.yml,
# build_docker_*.yml) ne compilent rien : ils délèguent ou fabriquent des
# images Docker. Ce workflow-ci est le seul garde-fou de compilation.
#
# Les jobs tournent dans un conteneur Arch Linux, comme la release
# (docker/Dockerfile part de archlinux:base-devel). Arch est rolling, donc on
# compile avec le Qt 6 le plus récent — celui des livrables. Ubuntu ne fournit
# que Qt 6.4.2, une version qu'aucune cible réelle n'utilise : y compiler ne
# prouverait rien sur ce qui est effectivement livré.

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build desktop (Qt6 / qmake)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Avant actions/checkout : l'image de base n'a pas git, sans quoi
      # l'action retombe sur un téléchargement d'archive REST.
      # La liste Qt est celle de depends()/makedepends() du PKGBUILD de
      # release (calaos/pkgbuilds/calaos-home), pour compiler exactement la
      # configuration livrée — webengine compris, sinon les blocs
      # HAVE_WEBENGINE de main.cpp et Application.cpp ne sont jamais compilés.
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            qt6-base \
            qt6-5compat \
            qt6-declarative \
            qt6-imageformats \
            qt6-svg \
            qt6-virtualkeyboard \
            qt6-webchannel \
            qt6-webengine \
            qt6-websockets \
            qt6-webview \
            qt6-shadertools \
            qt6-tools \
            libx11 \
            libxext

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          qmake6 -v
          g++ --version | head -n 1

      - name: qmake6 desktop.pro
        run: qmake6 desktop.pro

      - name: make
        run: make -j$(nproc)

  tests:
    name: Unit tests (Qt Test)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            qt6-base \
            qt6-declarative \
            qt6-websockets

      - name: Checkout
        uses: actions/checkout@v4

      # Build shadow : tests/tests.pro est un projet qmake autonome
      # (TEMPLATE=subdirs), il n'est inclus ni par desktop.pro ni par mobile.pro.
      - name: Build tests
        run: |
          mkdir -p build-tests
          cd build-tests
          qmake6 ../tests/tests.pro
          make -j$(nproc)

      - name: Run tests (make check)
        env:
          # Les binaires de test lient QtGui : pas de serveur X sur le runner.
          QT_QPA_PLATFORM: offscreen
        run: make -C build-tests check

  qmllint:
    name: qmllint (pragmatic)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git \
            python \
            qt6-base \
            qt6-declarative

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run qmllint
        run: |
          set -euo pipefail
          # L'exécutable n'est pas au même endroit selon la distribution
          # (/usr/lib/qt6/bin sur Arch et Debian, suffixé « -qt6 » sur Fedora).
          # On demande le répertoire à qmake plutôt que de le coder en dur.
          QMLLINT="$(qmake6 -query QT_HOST_BINS)/qmllint"
          if [ ! -x "$QMLLINT" ]; then
            QMLLINT="$(command -v qmllint-qt6 || command -v qmllint)"
          fi
          echo "qmllint: $QMLLINT"
          "$QMLLINT" --version

          mapfile -t QML_FILES < <(find qml widgets -type f -name '*.qml' | sort)
          echo "Linting ${#QML_FILES[@]} QML files"

          # Mode pragmatique : le code legacy produit des milliers de warnings
          # (« unqualified access », imports QuickFlux non résolus…). Le code de
          # retour de qmllint dépend de la version de Qt et des niveaux de
          # catégories : on ne s'y fie pas, la décision est prise à partir du
          # rapport JSON par l'étape suivante.
          "$QMLLINT" -I qml --json qmllint-report.json "${QML_FILES[@]}" \
            > qmllint-stdout.txt 2>&1 || true

          if [ ! -s qmllint-report.json ]; then
            echo "::error::qmllint n'a produit aucun rapport JSON"
            cat qmllint-stdout.txt || true
            exit 1
          fi

      - name: Evaluate qmllint report
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import sys

          with open("qmllint-report.json", encoding="utf-8") as fd:
              data = json.load(fd)

          # Le schéma JSON a varié entre versions de Qt : dict {"files": [...]}
          # aujourd'hui, liste de fichiers dans d'anciennes révisions.
          files = data.get("files", []) if isinstance(data, dict) else data

          by_type = collections.Counter()
          by_id = collections.Counter()
          blocking = []

          for entry in files:
              filename = entry.get("filename", "?")
              for w in entry.get("warnings", []):
                  wtype = str(w.get("type", "")).lower()
                  wid = str(w.get("id", ""))
                  by_type[wtype] += 1
                  by_id[wid] += 1
                  # Seules les vraies erreurs bloquent : erreur de syntaxe, ou
                  # diagnostic de sévérité critical/error. Les warnings legacy
                  # sont rapportés mais ne font pas échouer le job.
                  if wtype in ("critical", "error") or wid == "syntax":
                      blocking.append((filename, w.get("line"), w.get("column"),
                                       wid, w.get("message", "")))

          total = sum(by_type.values())
          lines = [
              "## qmllint",
              "",
              f"- Fichiers analysés : **{len(files)}**",
              f"- Diagnostics totaux : **{total}**",
              f"- Bloquants (syntax / critical / error) : **{len(blocking)}**",
              "",
              "| type | nombre |",
              "|---|---|",
          ]
          for wtype, count in by_type.most_common():
              lines.append(f"| {wtype or '(sans type)'} | {count} |")
          lines += ["", "Top catégories :", "", "| id | nombre |", "|---|---|"]
          for wid, count in by_id.most_common(10):
              lines.append(f"| {wid or '(sans id)'} | {count} |")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fd:
                  fd.write("\n".join(lines) + "\n")
          print("\n".join(lines))

          for filename, line, column, wid, message in blocking:
              print(f"::error file={filename},line={line},col={column}::"
                    f"[{wid}] {message}")

          if blocking:
              print(f"\n{len(blocking)} erreur(s) QML bloquante(s).")
              sys.exit(1)

          print("\nAucune erreur QML bloquante "
                "(les warnings legacy ne font pas échouer ce job).")
          PY

      - name: Upload qmllint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmllint-report
          path: |
            qmllint-report.json
            qmllint-stdout.txt
          if-no-files-found: warn
          retention-days: 14
